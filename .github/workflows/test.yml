name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 7
        shell: pwsh
        run: ./tests/Test-AccountsForCodex.ps1
      - name: Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/Test-AccountsForCodex.ps1
